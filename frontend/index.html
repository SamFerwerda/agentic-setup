<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supervisor Chat</title>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #eef0f5;
      --bg-accent: #dfe4f3;
      --surface: #ffffff;
      --surface-2: #f6f7fb;
      --border: #e3e6ee;
      --text: #1d2130;
      --muted: #6b7183;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --accent-text: #ffffff;
      --bubble: #f1f3f8;
      --phoenix: #f97316;
      --shadow: 0 24px 60px -20px rgba(30, 35, 70, 0.25), 0 2px 6px rgba(30, 35, 70, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --bg-accent: #171a26;
        --surface: #171a23;
        --surface-2: #1d212c;
        --border: #2a2f3c;
        --text: #e7e9f0;
        --muted: #9096a8;
        --bubble: #232835;
        --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 15% -10%, var(--bg-accent), transparent), var(--bg);
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    [v-cloak] { display: none; }

    /* The chat window */
    .window {
      width: min(1040px, 100%);
      height: min(760px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: 1fr 280px;
      grid-template-rows: auto 1fr;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .titlebar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .titlebar h1 { margin: 0 auto 0 0; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.01em; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    /* Chat column */
    .chat { display: flex; flex-direction: column; min-height: 0; }
    .log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .row { display: flex; gap: 10px; align-items: flex-end; animation: rise 0.18s ease-out; }
    .row.user { flex-direction: row-reverse; }
    .avatar {
      flex: none; width: 32px; height: 32px; border-radius: 10px;
      display: grid; place-items: center; font-size: 0.75rem; font-weight: 700;
      background: var(--bubble); color: var(--muted);
    }
    .row.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text); }
    .bubble {
      max-width: min(76%, 560px); padding: 11px 15px; border-radius: 16px;
      line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--bubble);
    }
    .row.assistant .bubble { border-bottom-left-radius: 5px; }
    .bubble.md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 0.6em; }
    .md h1, .md h2, .md h3, .md h4 { margin: 0.8em 0 0.4em; font-size: 1em; font-weight: 700; }
    .md h1 { font-size: 1.15em; }
    .md ul, .md ol { padding-left: 1.4em; }
    .md li + li { margin-top: 0.2em; }
    .md a { color: var(--accent); }
    .md code { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 0.88em; background: var(--surface); padding: 0.1em 0.35em; border-radius: 5px; }
    .md pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); }
    .md table { border-collapse: collapse; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 0.8em 0; }
    .row.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-text); border-bottom-right-radius: 5px;
    }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 380px; }
    .empty h2 { color: var(--text); font-size: 1.15rem; margin: 0; }

    .composer { display: flex; gap: 10px; padding: 14px 18px 18px; border-top: 1px solid var(--border); }
    .composer input {
      flex: 1; padding: 12px 14px; font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; outline: none;
    }
    .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

    button, .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: transform 0.1s, opacity 0.15s;
    }
    button:active, .button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; }
    .send { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text); }
    .approval { display: flex; gap: 8px; margin-left: 42px; }
    .approval button { padding: 8px 14px; font-size: 0.85rem; }
    .approve { background: #16a34a; color: #fff; }
    .reject { background: transparent; color: var(--text); border: 1px solid var(--border); }

    /* Side panel */
    .side {
      border-left: 1px solid var(--border); background: var(--surface-2);
      padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
    }
    .side h3 { margin: 0 0 8px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .id { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 0.78rem; overflow-wrap: anywhere; user-select: all; }
    .phoenix { background: var(--phoenix); color: #fff; width: 100%; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); width: 100%; }

    @media (max-width: 760px) {
      body { padding: 0; }
      .window { height: 100vh; border-radius: 0; border: 0; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      .side { grid-row: 2; border-left: 0; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; padding: 12px 16px; gap: 10px; }
      .side > section { flex: 1 1 140px; }
      .side h3 { display: none; }
      .log { padding: 16px; }
      .composer { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>
  <div id="app" class="window" v-cloak>
    <header class="titlebar">
      <h1>Supervisor Chat</h1>
    </header>

    <main class="chat">
      <div class="log" ref="log">
        <div v-if="!messages.length" class="empty">
          <h2>How can I help?</h2>
        </div>
        <div v-for="(m, i) in messages" :key="i" :class="['row', m.role]">
          <div class="avatar">{{ m.role === 'user' ? 'You' : 'AI' }}</div>
          <div v-if="m.role === 'assistant'" class="bubble md" v-html="renderMarkdown(m.content)"></div>
          <div v-else class="bubble">{{ m.content }}</div>
        </div>
        <div v-if="approval && !loading" class="approval">
          <button class="approve" @click="send(true)">Approve</button>
          <button class="reject" @click="send(false)">Reject</button>
        </div>
        <div v-if="loading" class="row assistant">
          <div class="avatar">AI</div>
          <div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>
        </div>
      </div>
      <form class="composer" @submit.prevent="send()">
        <input v-model="draft" ref="input" placeholder="Ask about animals or your files…" :disabled="loading" autofocus />
        <button class="send" :disabled="loading || !draft.trim()">Send</button>
      </form>
    </main>

    <aside class="side">
      <section>
        <h3>Observability</h3>
        <a class="button phoenix" :href="phoenixUrl" target="_blank" rel="noopener">To Phoenix ↗</a>
      </section>
      <section>
        <h3>Conversation</h3>
        <div class="id">{{ conversationId }}</div>
      </section>
      <section>
        <button class="ghost" @click="reset" :disabled="loading">New conversation</button>
      </section>
    </aside>
  </div>

  <script>
    const SUPERVISOR = "http://localhost:8000";

    Vue.createApp({
      data: () => ({
        conversationId: crypto.randomUUID(),
        messages: [],
        draft: "",
        loading: false,
        approval: null, // a tool call waiting for the user's approval
      }),
      computed: {
        phoenixUrl() { return `${SUPERVISOR}/conversations/${this.conversationId}/phoenix`; },
      },
      methods: {
        renderMarkdown(text) {
          const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
          const tmp = document.createElement("div");
          tmp.innerHTML = html;
          tmp.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
          return tmp.innerHTML;
        },
        async send(approved) {
          const isDecision = typeof approved === "boolean";
          const message = isDecision ? (approved ? "Approved." : "Rejected.") : this.draft.trim();
          if (!message || this.loading) return;
          this.messages.push({ role: "user", content: message });
          if (!isDecision) this.draft = "";
          this.approval = null;
          this.loading = true;
          this.scroll();
          try {
            const res = await fetch(`${SUPERVISOR}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(isDecision ? { conversation_id: this.conversationId, approved } : { conversation_id: this.conversationId, message }),
            });
            const data = res.ok ? await res.json() : { reply: `The supervisor returned an error (HTTP ${res.status}).` };
            this.messages.push({ role: "assistant", content: data.reply });
            this.approval = data.approval ?? null;
          } catch {
            this.messages.push({ role: "assistant", content: "The supervisor is unreachable." });
          }
          this.loading = false;
          this.scroll();
          this.$nextTick(() => this.$refs.input.focus());
        },
        scroll() {
          this.$nextTick(() => { this.$refs.log.scrollTop = this.$refs.log.scrollHeight; });
        },
        reset() {
          this.conversationId = crypto.randomUUID();
          this.messages = [];
          this.draft = "";
          this.approval = null;
        },
      },
    }).mount("#app");
  </script>
</body>
</html>
